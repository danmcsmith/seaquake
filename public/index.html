<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeaQuake — PNW Earthquake Visualizer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 12px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    header h1 span { color: #58a6ff; }

    #stats {
      display: flex;
      gap: 20px;
      margin-left: auto;
      font-size: 13px;
      color: #8b949e;
    }

    #stats strong { color: #e6edf3; }

    #map { flex: 1; }

    /* Legend */
    .legend {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      color: #e6edf3;
      line-height: 1.8;
    }

    .legend h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 6px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .leaflet-popup-tip { background: #161b22; }

    .leaflet-popup-content { margin: 12px 16px; font-size: 13px; line-height: 1.6; }

    .popup-mag {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .popup-place { color: #8b949e; font-size: 12px; margin-bottom: 8px; }

    .popup-detail { color: #8b949e; font-size: 12px; }
    .popup-detail span { color: #e6edf3; }

    .popup-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: #58a6ff;
      text-decoration: none;
    }

    .popup-link:hover { text-decoration: underline; }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      color: #8b949e;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sea<span>Quake</span></h1>
    <div id="stats">
      <div>Loading…</div>
    </div>
  </header>
  <div id="map"><div id="loading">Loading earthquake data…</div></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/scripts/main.js"></script>
</body>
</html>
